<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Enterprise Employee Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgb(240, 244, 255) 0%, rgb(248, 250, 252) 90%);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 2.5rem;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.6rem;
      margin-bottom: 1rem;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
    }
    .demo-credentials-box {
      background-color: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-icon">
          <i class="bi bi-people-fill"></i>
        </div>
        <h2 class="fw-bold text-dark mb-1">Apex EMS</h2>
        <p class="text-muted small">Enterprise Employee Management & HR Portal</p>
      </div>

      <!-- Demo Credentials Quick Bar -->
      <div class="demo-credentials-box">
        <div class="d-flex align-items-center justify-content-between mb-1">
          <span class="badge bg-primary text-white"><i class="bi bi-shield-lock me-1"></i> Demo Access</span>
          <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 fw-semibold" id="demoFillBtn">
            Auto-fill credentials
          </button>
        </div>
        <div class="small text-muted">
          <div>Email: <strong class="text-dark">admin@ems.com</strong></div>
          <div>Password: <strong class="text-dark">admin123</strong></div>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small text-dark">Administrator Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control form-control-custom border-start-0" id="email" placeholder="name@company.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label fw-semibold small text-dark mb-0">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control form-control-custom border-start-0 border-end-0" id="password" placeholder="Enter password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary border-start-0 bg-light" type="button" id="togglePassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label small text-muted" for="rememberMe">
              Remember me on this device
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2" id="submitBtn">
          <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <small class="text-muted">&copy; 2026 Apex EMS. Powered by Python Flask & MongoDB Atlas.</small>
      </div>
    </div>
  </div>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- App & Auth JS -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
